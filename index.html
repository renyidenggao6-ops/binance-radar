<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Binance Market Radar</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#080b10;
color:#eef2f6;
font-family:Arial,"Microsoft YaHei",sans-serif;
}

.header{
padding:16px;
background:#0d1118;
border-bottom:1px solid #202733;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
}

.status{
font-size:12px;
color:#15c784;
}

.subtitle{
color:#8b96a5;
font-size:12px;
margin-top:6px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
margin-top:14px;
}

.stat{
background:#131923;
border:1px solid #252d3a;
border-radius:10px;
padding:9px;
}

.stat small{
color:#7e8998;
font-size:10px;
}

.stat b{
display:block;
margin-top:5px;
font-size:15px;
}

.up{
color:#18c98b;
}

.down{
color:#f04b61;
}

.main{
max-width:1200px;
margin:auto;
}

.watch-box{
padding:14px;
border-bottom:1px solid #202733;
}

.section-title{
font-size:16px;
font-weight:bold;
margin-bottom:10px;
}

.watch-list{
display:flex;
gap:8px;
overflow-x:auto;
}

.watch{
min-width:145px;
padding:11px;
border-radius:10px;
background:#121824;
border:1px solid #283140;
}

.watch-rank{
color:#f0b90b;
font-size:11px;
}

.watch-symbol{
font-size:16px;
font-weight:bold;
margin-top:5px;
}

.score{
margin-top:6px;
font-size:12px;
}

.search-box{
padding:12px;
position:sticky;
top:0;
z-index:10;
background:#080b10;
border-bottom:1px solid #202733;
}

.search{
width:100%;
padding:12px;
background:#121824;
border:1px solid #2a3442;
color:white;
border-radius:9px;
font-size:14px;
}

.tabs{
display:flex;
gap:7px;
margin-top:10px;
overflow-x:auto;
}

.tab{
white-space:nowrap;
padding:8px 13px;
border-radius:20px;
border:1px solid #2a3442;
background:#121824;
color:#aeb8c5;
font-size:12px;
}

.tab.active{
background:#263142;
color:white;
}

.table{
padding:8px 10px 40px;
}

.row{
display:grid;
grid-template-columns:
1.35fr
1fr
.8fr
.8fr
.8fr;
gap:5px;
align-items:center;
padding:11px 6px;
border-bottom:1px solid #171d27;
}

.head{
color:#727d8b;
font-size:10px;
}

.coin{
font-weight:bold;
font-size:13px;
}

.perp{
font-size:9px;
color:#7f8997;
margin-top:3px;
}

.price{
text-align:right;
font-size:12px;
}

.change{
text-align:right;
font-size:12px;
font-weight:bold;
}

.trend{
text-align:right;
font-size:11px;
}

.loading{
text-align:center;
padding:50px 10px;
color:#84909e;
}

.modal{
display:none;
position:fixed;
z-index:100;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.75);
}

.modal-content{
position:absolute;
bottom:0;
width:100%;
max-height:88%;
overflow:auto;
background:#0d1118;
border-radius:18px 18px 0 0;
padding:16px;
}

.close{
float:right;
font-size:26px;
color:#aaa;
}

.detail-title{
font-size:22px;
font-weight:bold;
}

.detail-price{
font-size:25px;
margin-top:8px;
}

.detail-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
}

.detail-card{
background:#141a24;
border:1px solid #283140;
border-radius:10px;
padding:12px;
}

.detail-card small{
color:#87919e;
}

.detail-card b{
display:block;
font-size:18px;
margin-top:6px;
}

.chart{
margin-top:15px;
background:#101620;
border-radius:10px;
padding:8px;
}

canvas{
width:100%;
height:180px;
}

.note{
padding:15px;
color:#778291;
font-size:11px;
line-height:1.6;
}

@media(max-width:500px){

.stats{
grid-template-columns:repeat(2,1fr);
}

.row{
grid-template-columns:
1.25fr
1fr
.75fr
.75fr
.75fr;
}

.price{
font-size:10px;
}

.change{
font-size:10px;
}

.trend{
font-size:9px;
}

}
</style>
</head>

<body>

<div class="main">

<div class="header">

<div class="top">

<div>

<div class="logo">
⚡ Binance Market Radar
</div>

<div class="subtitle">
USDT 永续合约 · 15分钟 / 1小时市场雷达
</div>

</div>

<div class="status" id="status">
● 连接中
</div>

</div>

<div class="stats">

<div class="stat">
<small>监控币种</small>
<b id="count">--</b>
</div>

<div class="stat">
<small>上涨</small>
<b class="up" id="ups">--</b>
</div>

<div class="stat">
<small>下跌</small>
<b class="down" id="downs">--</b>
</div>

<div class="stat">
<small>更新时间</small>
<b id="time">--</b>
</div>

</div>

</div>

<div class="watch-box">

<div class="section-title">
🔥 当前重点观察
</div>

<div class="watch-list" id="watchList">

<div class="loading">
正在扫描市场...
</div>

</div>

</div>

<div class="search-box">

<input
class="search"
id="search"
placeholder="🔎 搜索币种，例如 BTC、SOL、DOGE、PEPE"
>

<div class="tabs">

<button class="tab active" data-mode="volume">
💰 活跃
</button>

<button class="tab" data-mode="up">
🚀 24H涨幅
</button>

<button class="tab" data-mode="down">
📉 24H跌幅
</button>

<button class="tab" data-mode="15m">
⚡ 15分钟
</button>

<button class="tab" data-mode="1h">
📊 1小时
</button>

</div>

</div>

<div class="table">

<div class="row head">

<div>交易对</div>

<div style="text-align:right">
价格
</div>

<div style="text-align:right">
24H
</div>

<div style="text-align:right">
15m
</div>

<div style="text-align:right">
1h
</div>

</div>

<div id="list">

<div class="loading">
正在读取 Binance 市场数据...
</div>

</div>

</div>

<div class="note">

公开市场行情 · 15分钟 / 1小时趋势<br>
点击任意币种查看详细走势图。

</div>

</div>

<div class="modal" id="modal">

<div class="modal-content">

<span class="close" onclick="closeModal()">
×
</span>

<div id="detail"></div>

</div>

</div>
<script>

let coins=[];

let mode="volume";

let searchText="";

const API="https://fapi.binance.com";


function formatPrice(n){

n=Number(n);

if(n>=1000){
return n.toLocaleString(
undefined,
{maximumFractionDigits:2}
);
}

if(n>=1){
return n.toFixed(3);
}

if(n>=0.01){
return n.toFixed(5);
}

return n.toFixed(8);

}


function getScore(x){

let score=50;

if(x.change24>0){
score+=Math.min(x.change24,10);
}else{
score+=Math.max(x.change24,-10);
}

if(x.change15!==null){

if(x.change15>0){
score+=Math.min(x.change15*3,15);
}else{
score+=Math.max(x.change15*3,-15);
}

}

if(x.change1h!==null){

if(x.change1h>0){
score+=Math.min(x.change1h*2,15);
}else{
score+=Math.max(x.change1h*2,-15);
}

}

if(
x.change15!==null &&
x.change1h!==null &&
x.change15>0 &&
x.change1h>0
){
score+=10;
}

return Math.round(
Math.max(0,Math.min(100,score))
);

}


function render(){

let data=[...coins];

if(searchText){

data=data.filter(x=>
x.symbol.includes(
searchText.toUpperCase()
)
);

}

if(mode==="volume"){

data.sort(
(a,b)=>b.volume-a.volume
);

}

if(mode==="up"){

data.sort(
(a,b)=>b.change24-a.change24
);

}

if(mode==="down"){

data.sort(
(a,b)=>a.change24-b.change24
);

}

if(mode==="15m"){

data.sort(
(a,b)=>
(b.change15??-999)-
(a.change15??-999)
);

}

if(mode==="1h"){

data.sort(
(a,b)=>
(b.change1h??-999)-
(a.change1h??-999)
);

}

data=data.slice(0,200);

if(!data.length){

document.getElementById("list").innerHTML=
'<div class="loading">没有找到这个币</div>';

return;

}

document.getElementById("list").innerHTML=

data.map(x=>{

let c24=
x.change24>=0?"up":"down";

let c15=
x.change15===null
?""
:x.change15>=0?"up":"down";

let c1h=
x.change1h===null
?""
:x.change1h>=0?"up":"down";

return `

<div
class="row"
onclick="openCoin('${x.symbol}')"
>

<div>

<div class="coin">
${x.symbol.replace("USDT","")}
</div>

<div class="perp">
USDT 永续 · 点击查看走势
</div>

</div>

<div class="price">
${formatPrice(x.price)}
</div>

<div class="change ${c24}">
${x.change24>=0?"+":""}
${x.change24.toFixed(2)}%
</div>

<div class="trend ${c15}">
${x.change15===null
?"--"
:(x.change15>=0?"+":"")+
x.change15.toFixed(2)+"%"
}
</div>

<div class="trend ${c1h}">
${x.change1h===null
?"--"
:(x.change1h>=0?"+":"")+
x.change1h.toFixed(2)+"%"
}
</div>

</div>

`;

}).join("");

}


function renderWatch(){

let best=[...coins]

.filter(x=>
x.change15!==null &&
x.change1h!==null
)

.sort(
(a,b)=>getScore(b)-getScore(a)
)

.slice(0,10);


document.getElementById("watchList").innerHTML=

best.map((x,i)=>{

let score=getScore(x);

return `

<div
class="watch"
onclick="openCoin('${x.symbol}')"
>

<div class="watch-rank">
TOP ${i+1}
</div>

<div class="watch-symbol">
${x.symbol.replace("USDT","")}
</div>

<div class="score">
雷达评分

<b class="${
score>=60?"up":"down"
}">
${score}
</b>

</div>

<div class="score">
15m：
${x.change15>=0?"+":""}
${x.change15.toFixed(2)}%
</div>

<div class="score">
1h：
${x.change1h>=0?"+":""}
${x.change1h.toFixed(2)}%
</div>

</div>

`;

}).join("");

}


function updateStats(){

document.getElementById("count").innerText=
coins.length;

document.getElementById("ups").innerText=
coins.filter(x=>x.change24>0).length;

document.getElementById("downs").innerText=
coins.filter(x=>x.change24<0).length;

let now=new Date();

document.getElementById("time").innerText=

now.getHours()
.toString()
.padStart(2,"0")
+
":"
+
now.getMinutes()
.toString()
.padStart(2,"0");

}


async function getKlineTrend(symbol,interval){

try{

let r=await fetch(

API+
"/fapi/v1/klines?symbol="+
symbol+
"&interval="+
interval+
"&limit=2"

);

let d=await r.json();

if(!Array.isArray(d)||d.length<2){

return null;

}

let oldPrice=
Number(d[0][4]);

let newPrice=
Number(d[1][4]);

if(!oldPrice){
return null;
}

return(
(newPrice-oldPrice)/
oldPrice
)*100;

}catch(e){

return null;

}

}


async function loadTrends(){

let targets=[...coins]

.sort(
(a,b)=>b.volume-a.volume
)

.slice(0,100);

let index=0;


async function worker(){

while(index<targets.length){

let x=
targets[index++];

x.change15=
await getKlineTrend(
x.symbol,
"15m"
);

x.change1h=
await getKlineTrend(
x.symbol,
"1h"
);

render();

}

}


let workers=[];

for(
let i=0;
i<8;
i++
){

workers.push(worker());

}

await Promise.all(workers);

render();

renderWatch();

}


async function loadMarket(){

try{

document.getElementById("status").innerText=
"● 正在连接";


let r=await fetch(
API+
"/fapi/v1/ticker/24hr"
);

let data=await r.json();


coins=data

.filter(x=>

x.symbol.endsWith("USDT")

&&
Number(x.quoteVolume)>0

)

.map(x=>({

symbol:x.symbol,

price:Number(x.lastPrice),

change24:
Number(x.priceChangePercent),

volume:
Number(x.quoteVolume),

change15:null,

change1h:null

}));


updateStats();

render();

document.getElementById("status").innerText=
"● 市场已连接";


await loadTrends();


document.getElementById("status").innerText=
"● 实时运行";


}catch(e){

console.log(e);

document.getElementById("status").innerText=
"● 连接失败";

document.getElementById("list").innerHTML=

`

<div class="loading">

无法连接 Binance 数据。<br><br>

请检查网络、VPN 或 Binance API 是否可以访问。

</div>

`;

}

}


async function openCoin(symbol){

let x=coins.find(
c=>c.symbol===symbol
);

if(!x){
return;
}


document.getElementById("modal").style.display=
"block";


document.getElementById("detail").innerHTML=

`

<div class="detail-title">
${symbol}
</div>

<div class="detail-price">
${formatPrice(x.price)} USDT
</div>

<div class="detail-grid">

<div class="detail-card">

<small>
24小时涨跌
</small>

<b class="${
x.change24>=0?"up":"down"
}">

${x.change24>=0?"+":""}
${x.change24.toFixed(2)}%

</b>

</div>

<div class="detail-card">

<small>
雷达评分
</small>

<b class="${
getScore(x)>=60?"up":"down"
}">

${getScore(x)} / 100

</b>

</div>

<div class="detail-card">

<small>
15分钟
</small>

<b class="${
x.change15>=0?"up":"down"
}">

${
x.change15===null
?"读取中"
:(x.change15>=0?"+":"")+
x.change15.toFixed(2)+"%"
}

</b>

</div>

<div class="detail-card">

<small>
1小时
</small>

<b class="${
x.change1h>=0?"up":"down"
}">

${
x.change1h===null
?"读取中"
:(x.change1h>=0?"+":"")+
x.change1h.toFixed(2)+"%"
}

</b>

</div>

</div>

<div class="chart">

<b>
15分钟走势图
</b>

<canvas id="chart15"></canvas>

</div>

<div class="chart">

<b>
1小时走势图
</b>

<canvas id="chart1h"></canvas>

</div>

<div class="note">

这里显示最近 60 根 K 线。<br>
15分钟与1小时同时向上，只代表当前趋势较一致，并不代表未来一定上涨。

</div>

`;


let d15=
await getChartData(
symbol,
"15m"
);

drawChart(
"chart15",
d15
);


let d1h=
await getChartData(
symbol,
"1h"
);

drawChart(
"chart1h",
d1h
);

}


function closeModal(){

document.getElementById("modal").style.display=
"none";

}


async function getChartData(
symbol,
interval
){

try{

let r=await fetch(

API+
"/fapi/v1/klines?symbol="+
symbol+
"&interval="+
interval+
"&limit=60"

);

let d=await r.json();

if(!Array.isArray(d)){
return [];
}

return d.map(
x=>Number(x[4])
);

}catch(e){

return [];

}

}


function drawChart(id,data){

let canvas=
document.getElementById(id);

if(!canvas||!data.length){
return;
}

let rect=
canvas.getBoundingClientRect();

canvas.width=
rect.width*2;

canvas.height=
180*2;

let ctx=
canvas.getContext("2d");

ctx.scale(2,2);

let w=rect.width;

let h=180;

let min=
Math.min(...data);

let max=
Math.max(...data);

let padding=15;

ctx.clearRect(
0,0,w,h
);

ctx.beginPath();


data.forEach((v,i)=>{

let x=
padding+
i*
(
(w-padding*2)/
(data.length-1)
);

let y=
h-padding-
(
(v-min)/
((max-min)||1)
)*
(h-padding*2);

if(i===0){

ctx.moveTo(x,y);

}else{

ctx.lineTo(x,y);

}

});


let first=data[0];

let last=
data[data.length-1];

ctx.strokeStyle=
last>=first
?"#18c98b"
:"#f04b61";

ctx.lineWidth=2;

ctx.stroke();

}


document.getElementById("search")
.addEventListener(
"input",
e=>{

searchText=
e.target.value;

render();

}
);


document.querySelectorAll(".tab")
.forEach(btn=>{

btn.onclick=()=>{

document
.querySelectorAll(".tab")
.forEach(x=>
x.classList.remove("active")
);

btn.classList.add("active");

mode=
btn.dataset.mode;

render();

};

});


document.getElementById("modal")
.addEventListener(
"click",
e=>{

if(e.target.id==="modal"){

closeModal();

}

});


loadMarket();

setInterval(
loadMarket,
60000
);

setInterval(
loadTrends,
180000
);

</script>

</body>
</html>
