name: Update Binance Futures Market Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Binance Futures data
        run: |
          cat > /tmp/update.py <<'PY'
          import json
          import time
          import urllib.request
          import urllib.parse
          import urllib.error
          from datetime import datetime, timezone

          BASES = [
              "https://fapi1.binance.com",
              "https://fapi2.binance.com",
              "https://fapi3.binance.com",
              "https://fapi4.binance.com",
              "https://fapi.binance.com"
          ]

          def request(path, params=None):
              query = ""
              if params:
                  query = "?" + urllib.parse.urlencode(params)

              for base in BASES:
                  url = base + path + query
                  try:
                      print("Request:", url)
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "Mozilla/5.0",
                              "Accept": "application/json"
                          }
                      )

                      with urllib.request.urlopen(req, timeout=25) as response:
                          if response.status == 200:
                              return json.loads(
                                  response.read().decode("utf-8")
                              )

                  except Exception as error:
                      print("Failed:", base, type(error).__name__)
                      continue

              return None

          print("Loading exchange information...")
          exchange = request("/fapi/v1/exchangeInfo")

          if not exchange:
              raise RuntimeError("All Binance Futures endpoints failed")

          symbols = {
              item["symbol"]
              for item in exchange.get("symbols", [])
              if item.get("contractType") == "PERPETUAL"
              and item.get("quoteAsset") == "USDT"
              and item.get("status") == "TRADING"
          }

          print("Trading symbols:", len(symbols))

          tickers = request("/fapi/v1/ticker/24hr")

          if not tickers:
              raise RuntimeError("Unable to load 24h ticker data")

          selected = []

          for ticker in tickers:
              symbol = ticker.get("symbol")

              if symbol not in symbols:
                  continue

              try:
                  volume = float(ticker.get("quoteVolume", 0))
                  price = float(ticker.get("lastPrice", 0))
                  change = float(ticker.get("priceChangePercent", 0))
                  high = float(ticker.get("highPrice", 0))
                  low = float(ticker.get("lowPrice", 0))

                  selected.append({
                      "symbol": symbol,
                      "price": price,
                      "change24h": change,
                      "high24h": high,
                      "low24h": low,
                      "quoteVolume24h": volume
                  })

              except Exception:
                  continue

          selected.sort(
              key=lambda item: item["quoteVolume24h"],
              reverse=True
          )

          selected = selected[:40]

          output = {
              "source": "Binance USDT-M Futures",
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "count": len(selected),
              "symbols": []
          }

          for item in selected:
              symbol = item["symbol"]

              record = dict(item)
              record["klines"] = {}

              for interval in ["15m", "1h"]:
                  candles = request(
                      "/fapi/v1/klines",
                      {
                          "symbol": symbol,
                          "interval": interval,
                          "limit": 120
                      }
                  )

                  if candles:
                      record["klines"][interval] = [
                          {
                              "time": candle[0],
                              "open": float(candle[1]),
                              "high": float(candle[2]),
                              "low": float(candle[3]),
                              "close": float(candle[4]),
                              "volume": float(candle[5])
                          }
                          for candle in candles
                      ]
                  else:
                      record["klines"][interval] = []

              output["symbols"].append(record)
              print("Completed:", symbol)

          with open("data.json", "w", encoding="utf-8") as file:
              json.dump(output, file, ensure_ascii=False)

          print("Saved data.json")
          print("Symbols:", len(output["symbols"]))
          PY

          python3 /tmp/update.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update Binance futures market data"
          git push
